<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mallick Tap</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #e5ddd5; display: flex; justify-content: center; height: 100dvh; }
    .app { width: 100%; max-width: 500px; background: #efeae2; display: flex; flex-direction: column; height: 100dvh; box-shadow: 0 0 15px rgba(0,0,0,0.15); }
    .header { background: #008069; color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: #25d366; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
    .title { font-size: 18px; font-weight: 600; }
    .subtitle { font-size: 12px; opacity: 0.85; }
    .logout-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .login-box { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; background: #fff; text-align: center; }
    .login-logo { width: 70px; height: 70px; border-radius: 50%; background: #008069; color: #fff; font-size: 32px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-weight: bold; }
    .login-box h2 { color: #008069; margin-bottom: 8px; }
    .login-box p { color: #667781; font-size: 14px; margin-bottom: 20px; }
    .login-box input { width: 100%; padding: 12px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; margin-bottom: 14px; outline: none; }
    .login-box input:focus { border-color: #008069; }
    .login-box button { width: 100%; padding: 12px; background: #008069; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 78%; padding: 8px 12px; border-radius: 10px; font-size: 15px; line-height: 1.4; position: relative; word-wrap: break-word; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
    .msg.me { align-self: flex-end; background: #d9fdd3; border-top-right-radius: 2px; }
    .msg.other { align-self: flex-start; background: #ffffff; border-top-left-radius: 2px; }
    .msg-sender { font-size: 11px; font-weight: 700; color: #008069; margin-bottom: 2px; }
    .msg-time { font-size: 10px; color: #667781; text-align: right; margin-top: 4px; }
    .input-area { background: #f0f2f5; padding: 10px; display: flex; gap: 8px; align-items: center; }
    .input-area input { flex: 1; padding: 11px 15px; border: none; border-radius: 24px; font-size: 15px; outline: none; background: #fff; }
    .send-btn { width: 44px; height: 44px; border-radius: 50%; background: #008069; color: #fff; border: none; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <div id="loginScreen" class="login-box">
      <div class="login-logo">M</div>
      <h2>Mallick Tap</h2>
      <p>চ্যাট শুরু করতে আপনার নাম লিখুন</p>
      <input type="text" id="usernameInput" placeholder="আপনার নাম লিখুন..." />
      <button onclick="loginUser()">চ্যাট শুরু করুন</button>
    </div>

    <div id="chatScreen" class="hidden" style="display:flex; flex-direction:column; height:100%;">
      <div class="header">
        <div class="header-left">
          <div class="avatar">M</div>
          <div>
            <div class="title">Mallick Tap</div>
            <div class="subtitle" id="currentUserLabel">Online</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logoutUser()">লগ-আউট</button>
      </div>

      <div class="messages" id="messagesBox"></div>

      <div class="input-area">
        <input type="text" id="messageInput" placeholder="মেসেজ লিখুন..." onkeypress="if(event.key==='Enter') sendMessage()" />
        <button class="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_KEY = "sb_publishable_9oZp9Cu1eyWy9G1cfmiQmA_7bfPQuqs";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = localStorage.getItem("mallick_tap_user") || "";
    let textCol = "text";
    let senderCol = "sender";

    function init() {
      if (currentUser) showChat();
    }

    function loginUser() {
      const name = document.getElementById("usernameInput").value.trim();
      if (!name) return alert("অনুগ্রহ করে আপনার নাম লিখুন!");
      currentUser = name;
      localStorage.setItem("mallick_tap_user", currentUser);
      showChat();
    }

    function logoutUser() {
      localStorage.removeItem("mallick_tap_user");
      currentUser = "";
      document.getElementById("chatScreen").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
    }

    async function showChat() {
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("chatScreen").classList.remove("hidden");
      document.getElementById("currentUserLabel").innerText = currentUser + " • Online";
      await loadMessages();
      subscribeRealtime();
    }

    async function loadMessages() {
      const { data, error } = await db.from("messages").select("*").order("created_at", { ascending: true });
      if (error) { console.error(error); return; }
      if (data && data.length > 0) {
        const sample = data[0];
        if ("content" in sample) textCol = "content";
        else if ("message" in sample) textCol = "message";
        else if ("text" in sample) textCol = "text";

        if ("username" in sample) senderCol = "username";
        else if ("name" in sample) senderCol = "name";
        else if ("sender" in sample) senderCol = "sender";
      }
      renderMessages(data || []);
    }

    function renderMessages(list) {
      const box = document.getElementById("messagesBox");
      box.innerHTML = "";
      list.forEach(item => {
        const sender = item[senderCol] || "User";
        const msgText = item[textCol] || item.text || item.content || item.message || "";
        const isMe = sender === currentUser;
        const time = item.created_at ? new Date(item.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";

        const div = document.createElement("div");
        div.className = "msg " + (isMe ? "me" : "other");
        div.innerHTML = `
          ${!isMe ? `<div class="msg-sender">${escapeHtml(sender)}</div>` : ""}
          <div>${escapeHtml(msgText)}</div>
          <div class="msg-time">${time}</div>
        `;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const val = input.value.trim();
      if (!val) return;
      input.value = "";

      const payload = {};
      payload[senderCol] = currentUser;
      payload[textCol] = val;

      let { error } = await db.from("messages").insert([payload]);
      if (error) {
        const altCol = textCol === "text" ? "content" : "text";
        const altPayload = {};
        altPayload[senderCol] = currentUser;
        altPayload[altCol] = val;
        const retry = await db.from("messages").insert([altPayload]);
        if (!retry.error) textCol = altCol;
      }
      await loadMessages();
    }

    function subscribeRealtime() {
      db.channel("mallick-tap-room")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, () => {
          loadMessages();
        })
        .subscribe();
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.innerText = str == null ? "" : String(str);
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
